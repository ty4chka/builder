name: Video

"on":
  workflow_dispatch:
    inputs:
      frames_url:
        description: "URL of frames.tgz (tar with frame_*.png)"
        required: true
      fps:
        description: "Framerate"
        required: false
        default: "10"
      freeze_last:
        description: "Freeze last frame seconds"
        required: false
        default: "2"
      release_tag:
        description: "Release tag name"
        required: true

jobs:
  video:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Install ffmpeg + PIL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pil

      - name: Fetch frames
        run: |
          curl -sL "${{ github.event.inputs.frames_url }}" -o frames.tgz
          mkdir frames && tar xzf frames.tgz -C frames
          ls frames | head

      - name: Build video
        run: |
          cd frames
          for f in frame_*.png; do
            python3 -c "
from PIL import Image
im = Image.open('$f'); im.thumbnail((1920, 1920)); im.save('$f')
" || true
          done
          FPS="${{ github.event.inputs.fps }}"
          FZ="${{ github.event.inputs.freeze_last }}"
          LAST=$(ls frame_*.png | sort | tail -1)
          ffmpeg -y -framerate $FPS -i frame_%02d.png -c:v libx264 -pix_fmt yuv420p -crf 20 p1.mp4
          [ "$FZ" != "0" ] && ffmpeg -y -loop 1 -i "$LAST" -t "$FZ" -c:v libx264 -pix_fmt yuv420p -crf 20 p2.mp4
          if [ -f p2.mp4 ]; then
            printf "file '%s/p1.mp4'\nfile '%s/p2.mp4'\n" "$PWD" "$PWD" > list.txt
            ffmpeg -y -f concat -safe 0 -i list.txt -c copy out.mp4
          else
            cp p1.mp4 out.mp4
          fi
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 out.mp4

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          files: frames/out.mp4
          fail_on_unmatched_files: false
